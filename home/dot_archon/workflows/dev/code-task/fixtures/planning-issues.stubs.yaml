# The planner raises proposal issues: within the pass, plan-review,
# final-check-plan, gate-summary and plan-approval are all skipped (none are
# stubbed, so any of them running would fail the fixture). Dry-run never
# evaluates until_bash, so the next pass (clarify reopening the requirements)
# is proven only by a real run.
fixture:
  expect: completed
intake:
  source: interview
  work_item_id: ""
  project: ""
  request: "add retry to the uploader"
  fallback_reason: ""
interview-round: "Q1 - stub round"
write-proposal: "stub"
check-proposal:
  acceptance_criteria: ["AC-1"]
  unresolved: []
discover-toolchain:
  has_tests: true
  test: "npm test"
  lint: ""
  build: ""
  typecheck: ""
baseline:
  red: []
plan: "0 tasks, 1 issue"
check-plan:
  has_issues: true
next-task: { done_all: true, task_id: "", phase: "" }
red-check: { red: false }
commit-end: { committed: false }
validation-start: { fix: false }
final-checks: { failures: [], needs_judge: false, judge: [] }
review-acceptance: { findings: [], uncovered: [] }
review-quality: { findings: [] }
review-security: { findings: [] }
review-errors: { findings: [] }
verification-setup: { needed: false }
findings-summary: { clean: true, count: 0, message: "No findings." }
docs-start: "snapshot saved"
write-docs: { glossary_terms: [], adrs: [] }
check-docs: "docs confined to the docs directory"
write-report: "# Report"
check-report: "report accounts for 1 acceptance criteria"
pr-check: { commits: 0, forge: github, branch: task-1 }
