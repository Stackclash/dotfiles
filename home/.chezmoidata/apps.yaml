# App definitions, one entry per app, with a block per OS:
#   windows: { id, method: winget|choco }    darwin: { id, method: brew|brew-cask|brew-tap }
#   linux:   one key per package manager -> package name, e.g.
#            { omarchy: shipped, pacman: git, apt: git }
#            The first manager in this distro's list (linux-package-managers.yaml)
#            that the app defines is used. `omarchy:` is either `shipped` (Omarchy
#            already provides it) or { installer: <omarchy-install-* suffix>, package }.
# forPersonal: true skips the app on work machines.
apps:

  # Apps
  orcaslicer:
    forPersonal: true
    windows:
      id: "SoftFever.OrcaSlicer"
      method: "winget"
    linux:
      aur: orca-slicer-bin

  claude:
    forPersonal: false
    windows:
      id: "Anthropic.Claude"
      method: "winget"
    darwin:
      id: "claude"
      method: "brew-cask"

  steam:
    forPersonal: true
    windows:
      id: "Valve.Steam"
      method: "winget"
    linux:
      omarchy: { installer: gaming-steam, package: steam }
      pacman: steam

  blender:
    forPersonal: true
    windows:
      id: "BlenderFoundation.Blender"
      method: "winget"
    linux:
      pacman: blender

  calibre:
    forPersonal: true
    windows: 
      id: "calibre.calibre"
      method: "winget"
    linux:
      pacman: calibre

  syncthing:
    forPersonal: false
    windows:
      id: "Syncthing.Syncthing"
      method: "winget"
    darwin:
      id: "syncthing"
      method: "brew"
    linux:
      pacman: syncthing

  # CLI Tools
  mise:
    forPersonal: false
    windows:
      id: "jdx.mise"
      method: "winget"
    darwin:
      id: "mise"
      method: "brew"
    linux:
      omarchy: shipped # as mise-bin
      pacman: mise
  
  starship: # Omarchy ships it; shared config in dot_config/starship.toml
    forPersonal: false
    windows:
      id: "Starship.Starship"
      method: "winget"
    darwin:
      id: "starship"
      method: "brew"
    linux:
      omarchy: shipped
      pacman: starship

  gh:
    forPersonal: false
    windows:
      id: "Github.cli"
      method: "winget"
    darwin:
      id: "gh"
      method: "brew"

  git:
    forPersonal: false
    windows:
      id: "Git.Git"
      method: "winget"
    darwin:
      id: "git"
      method: "brew"
    linux:
      omarchy: shipped
      pacman: git

  powershell:
    forPersonal: false
    windows:
      id: "Microsoft.PowerShell"
      method: "winget"

  zsh:
    forPersonal: false
    darwin:
      id: "zsh"
      method: "brew"

  DotNetSDK:
    forPersonal: false
    windows:
      id: "Microsoft.DotNet.SDK"
      method: "winget"
    darwin:
      id: "dotnet"
      method: "brew"
    linux:
      pacman: dotnet-sdk

  copilot-cli:
    forPersonal: false
    windows:
      id: "GitHub.Copilot"
      method: "winget"
    darwin:
      id: "copilot-cli"
      method: "brew"

  # Browser
  firefox-dev:
    forPersonal: false
    windows:
      id: "Mozilla.Firefox.DeveloperEdition"
      method: "winget"
    darwin:
      id: "firefox@developer-edition"
      method: "brew-cask"
    linux:
      pacman: firefox-developer-edition

  chrome:
    forPersonal: false
    windows:
      id: "Google.Chrome"
      method: "winget"
    darwin:
      id: "google-chrome"
      method: "brew-cask"
    linux:
      aur: google-chrome

  # Media
  icloud:
    forPersonal: true
    windows:
      id: "9PKTQ5699M62"
      method: "winget"

  vlc:
    forPersonal: true
    windows:
      id: "VideoLAN.VLC"
      method: "winget"
    darwin:
      id: "vlc"
      method: "brew-cask"
    linux:
      pacman: vlc

  open-office:
    forPersonal: false
    windows:
      id: "Apache.OpenOffice"
      method: "winget"
    linux:
      omarchy: shipped # as libreoffice-fresh
      pacman: libreoffice-fresh

  # Developer Tools
  vscode:
    forPersonal: false
    windows:
      id: "Microsoft.VisualStudioCode"
      method: "winget"
    darwin:
      id: "visual-studio-code"
      method: "brew-cask"
    linux:
      omarchy: { installer: editor-vscode, package: visual-studio-code-bin }
      aur: visual-studio-code-bin

  postman:
    forPersonal: false
    windows:
      id: "Postman.Postman"
      method: "winget"
    darwin:
      id: "postman"
