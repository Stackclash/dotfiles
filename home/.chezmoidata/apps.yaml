# App definitions, one entry per app, with a block per OS:
#   windows: { id, method: winget|choco }    darwin: { id, method: brew|brew-cask|brew-tap }
#   linux:   one key per package manager -> package name, e.g.
#            { omarchy: shipped, pacman: git, apt: git }
#            The first manager in this distro's list (linux-package-managers.yaml)
#            that the app defines is used. `omarchy:` is either `shipped` (Omarchy
#            already provides it) or { installer: <omarchy-install-* suffix>, package }.
# forPersonal: true skips the app on work machines.
#
# Anything mise can install belongs in dot_config/mise/config.toml.tmpl, not here.
# Apps stay here when mise has no build for them, or when the OS package is
# needed (Docker CLI plugins, syncthing's systemd unit, PowerShell as a system shell).
apps:

  # Apps
  orcaslicer:
    forPersonal: true
    windows:
      id: "SoftFever.OrcaSlicer"
      method: "winget"
    linux:
      aur: orca-slicer-bin

  claude:
    forPersonal: false
    windows:
      id: "Anthropic.Claude"
      method: "winget"
    darwin:
      id: "claude"
      method: "brew-cask"

  steam:
    forPersonal: true
    windows:
      id: "Valve.Steam"
      method: "winget"
    linux:
      omarchy: { installer: gaming-steam, package: steam }
      pacman: steam

  blender:
    forPersonal: true
    windows:
      id: "BlenderFoundation.Blender"
      method: "winget"
    linux:
      pacman: blender

  calibre:
    forPersonal: true
    windows: 
      id: "calibre.calibre"
      method: "winget"
    linux:
      pacman: calibre

  syncthing:
    forPersonal: false
    windows:
      id: "Syncthing.Syncthing"
      method: "winget"
    darwin:
      id: "syncthing"
      method: "brew"
    linux:
      pacman: syncthing

  # CLI Tools
  mise:
    forPersonal: false
    windows:
      id: "jdx.mise"
      method: "winget"
    darwin:
      id: "mise"
      method: "brew"
    linux:
      omarchy: shipped # as mise-bin
      pacman: mise
  
  git:
    forPersonal: false
    windows:
      id: "Git.Git"
      method: "winget"
    darwin:
      id: "git"
      method: "brew"
    linux:
      omarchy: shipped
      pacman: git

  powershell:
    forPersonal: false
    windows:
      id: "Microsoft.PowerShell"
      method: "winget"

  zsh:
    forPersonal: false
    darwin:
      id: "zsh"
      method: "brew"

  # Browser
  firefox-dev:
    forPersonal: false
    windows:
      id: "Mozilla.Firefox.DeveloperEdition"
      method: "winget"
    darwin:
      id: "firefox@developer-edition"
      method: "brew-cask"
    linux:
      pacman: firefox-developer-edition

  chrome:
    forPersonal: false
    windows:
      id: "Google.Chrome"
      method: "winget"
    darwin:
      id: "google-chrome"
      method: "brew-cask"
    linux:
      aur: google-chrome

  # Media
  icloud:
    forPersonal: true
    windows:
      id: "9PKTQ5699M62"
      method: "winget"

  vlc:
    forPersonal: true
    windows:
      id: "VideoLAN.VLC"
      method: "winget"
    darwin:
      id: "vlc"
      method: "brew-cask"
    linux:
      pacman: vlc

  open-office:
    forPersonal: false
    windows:
      id: "Apache.OpenOffice"
      method: "winget"
    linux:
      omarchy: shipped # as libreoffice-fresh
      pacman: libreoffice-fresh

  # Developer Tools
  vscode:
    forPersonal: false
    windows:
      id: "Microsoft.VisualStudioCode"
      method: "winget"
    darwin:
      id: "visual-studio-code"
      method: "brew-cask"
    linux:
      omarchy: { installer: editor-vscode, package: visual-studio-code-bin }
      aur: visual-studio-code-bin

  postman:
    forPersonal: false
    windows:
      id: "Postman.Postman"
      method: "winget"
    darwin:
      id: "postman"
      method: "brew-cask"
    linux:
      aur: postman-bin

  yubikey-manager:
    forPersonal: false
    windows:
      id: "Yubico.YubikeyManager"
      method: "winget"
    linux:
      pacman: yubikey-manager

  putty:
    forPersonal: false
    windows:
      id: "PuTTY.PuTTY"
      method: "winget"

  docker:
    forPersonal: false
    windows:
      id: "Docker.DockerDesktop"
      method: "winget"
    darwin:
      id: "docker"
      method: "brew-cask"
    linux:
      omarchy: shipped
      pacman: docker

  iterm2:
    forPersonal: false
    darwin:
      id: "iterm2"
      method: "brew-cask"

  # Second Brain
  obsidian:
    forPersonal: false
    windows:
      id: "Obsidian.Obsidian"
      method: "winget"
    darwin:
      id: "obsidian"
      method: "brew-cask"
    linux:
      omarchy: shipped
      pacman: obsidian
  
  # Fonts
  fira-code-mono:
    forPersonal: false
    windows:
      id: "nerd-fonts-firamono"
      method: "choco"
    darwin:
      id: "font-fira-mono"
      method: "brew-cask"
    linux:
      pacman: ttf-fira-mono
  
  nerd-fonts-firacode:
    forPersonal: false
    windows:
      id: "nerd-fonts-firacode"
      method: "choco"
    darwin:
      id: "font-fira-code-nerd-font"
      method: "brew-cask"
    linux:
      pacman: ttf-firacode-nerd
  # Others
  glazewm:
    forPersonal: true
    windows:
      id: "glzr-io.glazewm"
      method: "winget"
      
  yasb:
    forPersonal: true
    windows:
      id: "AmN.yasb"
      method: "winget"
      
  flow-launcher:
    forPersonal: true
    windows:
      id: "Flow-Launcher.Flow-Launcher"
      method: "winget"
      
  zsh-autosuggestions:
    forPersonal: false
    darwin:
      id: "zsh-autosuggestions"
      method: "brew"

  # Omarchy base apps -- shipped with Omarchy (install/omarchy-base.packages),
  # installed on every other Linux machine so the setup matches. Only what mise
  # can't manage lives here; Omarchy's CLI tools are in dot_config/mise/config.toml.tmpl.
  # Desktop pieces (Hyprland, quickshell, SDDM, fcitx, ...) are left to Omarchy itself.
  # apt/dnf names are only listed where verified; otherwise the app is skipped there.
  chromium:       { forPersonal: false, linux: { omarchy: shipped, pacman: chromium, apt: chromium, dnf: chromium } }
  docker-buildx:  { forPersonal: false, linux: { omarchy: shipped, pacman: docker-buildx } }
  docker-compose: { forPersonal: false, linux: { omarchy: shipped, pacman: docker-compose } }
  localsend:      { forPersonal: false, linux: { omarchy: shipped, aur: localsend-bin } }
  mpv:            { forPersonal: false, linux: { omarchy: shipped, pacman: mpv, apt: mpv, dnf: mpv } }
  plocate:        { forPersonal: false, linux: { omarchy: shipped, pacman: plocate, apt: plocate, dnf: plocate } }
  unzip:          { forPersonal: false, linux: { omarchy: shipped, pacman: unzip, apt: unzip, dnf: unzip } }
  wl-clipboard:   { forPersonal: false, linux: { omarchy: shipped, pacman: wl-clipboard, apt: wl-clipboard, dnf: wl-clipboard } }
