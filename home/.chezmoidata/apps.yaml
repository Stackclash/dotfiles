    forPersonal: false
    windows:
      id: "nerd-fonts-firamono"
      method: "choco"
    darwin:
      id: "font-fira-mono"
      method: "brew-cask"
    linux:
      pacman: ttf-fira-mono
  
  nerd-fonts-firacode:
    forPersonal: false
    windows:
      id: "nerd-fonts-firacode"
      method: "choco"
    darwin:
      id: "font-fira-code-nerd-font"
      method: "brew-cask"
    linux:
      pacman: ttf-firacode-nerd
  # Others
  glazewm:
    forPersonal: true
    windows:
      id: "glzr-io.glazewm"
      method: "winget"
      
  yasb:
    forPersonal: true
    windows:
      id: "AmN.yasb"
      method: "winget"
      
  flow-launcher:
    forPersonal: true
    windows:
      id: "Flow-Launcher.Flow-Launcher"
      method: "winget"
      
  zsh-autosuggestions:
    forPersonal: false
    darwin:
      id: "zsh-autosuggestions"
      method: "brew"

  7zip:
    forPersonal: false
    windows:
      id: "7zip"
      method: "choco"
    darwin:
      id: "p7zip"
      method: "brew"
    linux:
      pacman: 7zip

  # Omarchy base tools -- shipped with Omarchy (install/omarchy-base.packages),
  # installed on every other Linux machine so the setup matches. Desktop pieces
  # (Hyprland, quickshell, SDDM, fcitx, ...) are left to Omarchy itself.
  # apt/dnf names are only listed where verified; otherwise the app is skipped there.
  bat:            { forPersonal: false, linux: { omarchy: shipped, pacman: bat, apt: bat, dnf: bat } }
  btop:           { forPersonal: false, linux: { omarchy: shipped, pacman: btop, apt: btop, dnf: btop } }
  chromium:       { forPersonal: false, linux: { omarchy: shipped, pacman: chromium, apt: chromium, dnf: chromium } }
  docker-buildx:  { forPersonal: false, linux: { omarchy: shipped, pacman: docker-buildx } }
  docker-compose: { forPersonal: false, linux: { omarchy: shipped, pacman: docker-compose } }
  eza:            { forPersonal: false, linux: { omarchy: shipped, pacman: eza, apt: eza } }
  fastfetch:      { forPersonal: false, linux: { omarchy: shipped, pacman: fastfetch, apt: fastfetch, dnf: fastfetch } }
  fd:             { forPersonal: false, linux: { omarchy: shipped, pacman: fd, apt: fd-find, dnf: fd-find } }
  fzf:            { forPersonal: false, linux: { omarchy: shipped, pacman: fzf, apt: fzf, dnf: fzf } }
  gum:            { forPersonal: false, linux: { omarchy: shipped, pacman: gum } }
  jq:             { forPersonal: false, linux: { omarchy: shipped, pacman: jq, apt: jq, dnf: jq } }
  lazygit:        { forPersonal: false, linux: { omarchy: shipped, pacman: lazygit } }
  localsend:      { forPersonal: false, linux: { omarchy: shipped, aur: localsend-bin } }
  mpv:            { forPersonal: false, linux: { omarchy: shipped, pacman: mpv, apt: mpv, dnf: mpv } }
  neovim:         { forPersonal: false, linux: { omarchy: shipped, pacman: neovim, apt: neovim, dnf: neovim } }
  plocate:        { forPersonal: false, linux: { omarchy: shipped, pacman: plocate, apt: plocate, dnf: plocate } }
  ripgrep:        { forPersonal: false, linux: { omarchy: shipped, pacman: ripgrep, apt: ripgrep, dnf: ripgrep } }
  tldr:           { forPersonal: false, linux: { omarchy: shipped, pacman: tldr, apt: tldr, dnf: tldr } }
  tmux:           { forPersonal: false, linux: { omarchy: shipped, pacman: tmux, apt: tmux, dnf: tmux } }
  unzip:          { forPersonal: false, linux: { omarchy: shipped, pacman: unzip, apt: unzip, dnf: unzip } }
  wl-clipboard:   { forPersonal: false, linux: { omarchy: shipped, pacman: wl-clipboard, apt: wl-clipboard, dnf: wl-clipboard } }
