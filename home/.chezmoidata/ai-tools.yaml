# AI developer tools, managed by the AI-tools sync workflow.
# Mirrors apps.yaml: edit this file and run `chezmoi apply` to add/update tools.
# The run_onchange_after_04-sync-ai-tools script does the work. See
# docs/pages/ai-tools.md for details.
#
# aiTools is organized by category -- mcp, plugin, skill, package, custom --
# each a map of tool name to its definition. Every entry may set:
#   forPersonal: true|false  -- optional; skipped on work machines
#   agents: [claude, ...]    -- optional on mcp, skill and custom entries:
#                               which agents (keys of ai-agents.yaml) receive
#                               it. Omit to target every agent.
# plugin entries target an agent by declaring a subkey named after it;
# package entries have no per-agent behavior. Neither carries `agents`.
# HOW each agent receives a tool (CLI flags, directories, MCP mechanism) is
# defined once per agent in ai-agents.yaml, not here.
#
# Per-category payloads
#   mcp:     { config: {...} } -- verbatim MCP server JSON: any field either
#            Claude's `claude mcp add-json` or VS Code's mcp.json supports.
#            String values inside config may contain a chezmoi template
#            expression (e.g. Doppler's dopplerProjectJson) -- resolved via
#            `chezmoi execute-template` at apply time. See docs/pages/ai-tools.md.
#   package: { mise: { backend: npm|pipx, package }, postInstall, projectNote }
#   plugin:  { <agent>: { marketplaceAdd, install } } -- agents with plugins.supported
#   skill:   { repo: owner/repo, skill } -- installed from a GitHub repo with
#            the skills CLI (`npx skills add`); omit `skill` to take the whole
#            repo. Each agent's skills.cliAgent is passed as the CLI's --agent.
#   custom:  { kind: skill|agent } -- content authored under ~/.ai/<kind>/<name>

aiTools:
  mcp:
    playwright-mcp:
      config:
        type: stdio
        command: npx
        args:
          - "@playwright/mcp@latest"

    context7:
      config:
        type: http
        url: "https://mcp.context7.com/mcp"
        headers:
          CONTEXT7_API_KEY: "{{ (dopplerProjectJson).CONTEXT7_API_TOKEN }}"

    github:
      config:
        type: http
        url: "https://api.githubcopilot.com/mcp/"
        headers:
          Authorization: "Bearer {{ (dopplerProjectJson).GITHUB_PAT }}"

    azure-ado:
      config:
        type: stdio
        command: npx
        args:
          - "-y"
          - "@azure-devops/mcp"
          - "{{ (dopplerProjectJson).AZURE_ORG }}"

  plugin:
    superpowers:
      claude:
        marketplaceAdd: "anthropics/claude-plugins-official"
        install: "superpowers@claude-plugins-official"
      copilot:
        marketplaceAdd: "obra/superpowers-marketplace"
        install: "superpowers@superpowers-marketplace"

  skill:
    # Installed with the skills CLI:
    #   npx --yes skills add <repo> [--skill <skill>] --agent <skills.cliAgent> -g -y
    # One invocation per agent, global (-g) so the skill lands in the
    # user-level skills directory. Drop `skill:` to install every skill in the repo.
    #
    # `skill:` must match the published skill name exactly -- the CLI does not
    # fuzzy-match, it just lists what the repo actually offers and exits.
    # `npx skills add <repo>` with no --skill prints the available names.
    #
    # brainstorming:
    #   agents: [claude, codex]   # optional; omit for every agent
    #   repo: obra/superpowers
    #   skill: brainstorming
    web-design-guidelines:
      repo: vercel-labs/agent-skills
      skill: web-design-guidelines

    vercel-react-best-practices:
      repo: vercel-labs/agent-skills
      skill: vercel-react-best-practices

  package:
    graphify:
      mise:
        backend: pipx
        package: graphifyy
      postInstall: "graphify install"

    openspec:
      mise:
        backend: npm
        package: "@fission-ai/openspec"
      projectNote: "Run `openspec init` inside each repo to scaffold its openspec/ folder."

  custom:
    # Author the content under home/dot_ai/skills/<name>/ (a skill) or
    # home/dot_ai/agents/<name>/ (an agent), then uncomment and rename:
    #
    # my-skill:
    #   agents: [claude, codex]   # optional; omit for every agent
    #   kind: skill        # skill | agent
