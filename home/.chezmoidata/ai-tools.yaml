aiTools:

  # Plugin marketplaces + plugins to install, for whichever of the Claude
  # Code / GitHub Copilot CLIs are present (both use the same
  # `<cli> plugin marketplace add` / `<cli> plugin install` subcommands).
  #
  # Optional `clis` restricts a plugin to specific CLIs (`claude`, `copilot`).
  # Omit it to install on both (the default).
  pluginMarketplaces:
    superpowers:
      marketplace: "obra/superpowers-marketplace"
      plugin: "superpowers@superpowers-marketplace"
      # clis: ["claude"]  # example: install on Claude Code only

    openspec-superpowers-workflow:
      # Pinned to a commit since this plugin lives in a subdirectory of a
      # larger, less curated marketplace repo (claude-dev-workflow).
      marketplace: "chinlung/claude-dev-workflow#ef31514c86213b9124ca1de8cd148449c5e51a79"
      plugin: "openspec-superpowers-workflow@scl-claude-plugins"

  # MCP servers, registered via the Claude Code CLI (`claude mcp add --scope
  # user`), the Copilot CLI (`copilot mcp add`), and VS Code/Copilot Chat's
  # user mcp.json — all generated from this one list.
  #
  # Optional `clis` restricts CLI registration to specific CLIs (`claude`,
  # `copilot`); omit it to register on both (the default). This only affects
  # the two CLIs — the server is always written to VS Code's mcp.json.
  #
  # Optional `apiKeyFlag` + `apiKeyVar` append a CLI flag sourced from a
  # chezmoi data value (e.g. a promptStringOnce'd secret) when it is non-empty.
  mcpServers:
    playwright:
      command: "npx"
      args:
        - "-y"
        - "@playwright/mcp@latest"

    context7:
      command: "npx"
      args:
        - "-y"
        - "@upstash/context7-mcp"
      apiKeyFlag: "--api-key"
      apiKeyVar: "context7ApiKey"

  # CLI tools installed via mise (home/dot_config/mise/config.toml) that need
  # a one-time command run afterwards to register their skill with whichever
  # AI assistants they detect on the machine. Run through `mise exec --` so
  # it works whether or not mise's shims are already on PATH.
  cliSkills:
    graphify:
      command: "graphify install"

  # Third-party skills not distributed via a plugin marketplace — fetched
  # directly from a path inside a git repo and copied into
  # ~/.claude/skills/<key>/. Optional `ref` pins a branch/tag; omit it to
  # track the repo's default branch.
  remoteSkills:
    read-bin-docs:
      repo: "https://github.com/YPares/agent-skills.git"
      path: "read-bin-docs"
