# AI developer tools, managed by the AI-tools sync workflow.
# Mirrors apps.yaml: edit this file and run `chezmoi apply` to add/update tools.
# The run_onchange_after_04-sync-ai-tools script does the work. See
# docs/pages/ai-tools.md for details.
#
# aiTools is organized by category -- mcp, plugin, package, custom -- each a
# map of tool name to its definition. Common fields on every entry:
#   assistant:   claude | copilot | both   -- which assistant(s) the tool targets
#   forPersonal: true|false                 -- optional; skipped on work machines
#
# Per-category payloads
#   mcp:     { config: {...} } -- verbatim MCP server JSON: any field either
#            Claude's `claude mcp add-json` or VS Code's mcp.json supports.
#            String values inside config may contain a chezmoi template
#            expression (e.g. Doppler's dopplerProjectJson) -- resolved via
#            `chezmoi execute-template` at apply time. See docs/pages/ai-tools.md.
#   package: { mise: { backend: npm|pipx, package }, postInstall, projectNote }
#   plugin:  { claude|copilot: { marketplaceAdd, install } }
#   custom:  { kind: skill|agent } -- content authored under ~/.ai/<kind>/<name>

aiTools:
  mcp:
    playwright-mcp:
      assistant: both
      config:
        type: stdio
        command: npx
        args:
          - "@playwright/mcp@latest"

    context7:
      assistant: both
      config:
        type: http
        url: "https://mcp.context7.com/mcp"
        # Doppler-backed secret, resolved via `chezmoi execute-template` at
        # apply time. Swap "dotfiles"/"prd" for your own Doppler project and
        # config names. Remove the headers block entirely to run keyless
        # (rate-limited).
        headers:
          CONTEXT7_API_KEY: "{{ (dopplerProjectJson \"dotfiles\" \"prd\").CONTEXT7_API_KEY }}"

  plugin:
    superpowers:
      assistant: both
      claude:
        marketplaceAdd: "anthropics/claude-plugins-official"
        install: "superpowers@claude-plugins-official"
      copilot:
        marketplaceAdd: "obra/superpowers-marketplace"
        install: "superpowers@superpowers-marketplace"

  package:
    graphify:
      assistant: claude
      mise:
        backend: pipx
        package: graphifyy
      postInstall: "graphify install"

    openspec:
      assistant: both
      mise:
        backend: npm
        package: "@fission-ai/openspec"
      projectNote: "Run `openspec init` inside each repo to scaffold its openspec/ folder."

  custom:
    # Author the content under home/dot_ai/skills/<name>/ (a skill) or
    # home/dot_ai/agents/<name>/ (an agent), then uncomment and rename:
    #
    # my-skill:
    #   assistant: both
    #   kind: skill        # skill | agent
