site_name: My Cross-Platform Dotfiles
site_url: https://stackclash.github.io/dotfiles
repo_url: https://github.com/Stackclash/dotfiles
edit_uri: blob/master/docs/pages/
remote_branch: gh-pages
docs_dir: ./pages
nav:
  - Home: index.md

  - Guides:
      - Introduction: index.md
      - Scripts: scripts.md
      - Templates: templates.md
      - Configuration: configuration.md
      - AI Tools: ai-tools.md
      - Archon code-task Workflow: archon-code-task.md
      - Themes: themes.md

  - Applications:
      - Visual Studio Code: applications/vscode.md
      # Add additional applications here, e.g.:
      # - Terminal: applications/terminal.md
      # - Git: applications/git.md

  - About:
      - Repository: https://github.com/Stackclash/dotfiles
theme:
  name: material
markdown_extensions:
  - github-callouts
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format